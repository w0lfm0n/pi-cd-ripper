OUTPUTTYPE=flac
FLACOPTS="-s -e -V -8"
# EDIT ME: must match MUSIC_DIR in /etc/cd-ripper.env. abcde runs under `su -l pi`,
# which strips the environment, so this can't be templated — set it here directly.
OUTPUTDIR="/mnt/music/Music"
# SINGLE quotes are mandatory: abcde sources this file in bash, so double quotes
# expand ${ARTIST}/${ALBUM} at load time (empty) -> everything collides into " - / - ".
# Use the *FILE (munged) variables — ${ARTIST}/${ALBUM} come back empty at
# move time in abcde 2.9.3, ${ARTISTFILE}/${ALBUMFILE} are the filesystem-safe ones.
OUTPUTFORMAT='${ARTISTFILE} - ${ALBUMFILE}/${TRACKNUM} - ${TRACKFILE}'
VAOUTPUTFORMAT='Various - ${ALBUMFILE}/${TRACKNUM} - ${ARTISTFILE} - ${TRACKFILE}'
PADTRACKS=y
MAXPROCS=4
CDDBMETHOD=musicbrainz
EJECTCD=y
ACTIONS=cddb,read,encode,tag,move,clean

mungefilename () { echo "$@" | sed -e "s/[:\*?\"<>|]//g" -e "s/^\.*//"; }
